<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #e91e63;
            text-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
        }

        .scoreboard {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .scoreboard span {
            color: #ccc;
        }

        .scoreboard strong {
            color: #ffeb3b;
        }

        canvas {
            border: 3px solid #e91e63;
            border-radius: 8px;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.2);
            cursor: none;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 12px;
            border: 2px solid #e91e63;
            display: none;
        }

        .overlay h2 {
            color: #e91e63;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .overlay p {
            margin-bottom: 20px;
            color: #ddd;
        }

        .overlay button {
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background-color 0.2s;
            margin: 0 5px;
        }

        .overlay button:hover {
            background-color: #c2185b;
        }

        .overlay button.secondary {
            background-color: #555;
        }

        .overlay button.secondary:hover {
            background-color: #666;
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #e91e63;
        }

        .container {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-link">← Voltar ao Hub</a>
        <h1>🧱 Breakout</h1>
        <span></span>
    </div>

    <div class="scoreboard">
        <span>Pontuação: <strong id="score">0</strong></span>
        <span>Vidas: <strong id="lives">3</strong></span>
        <span>Recorde: <strong id="highscore">0</strong></span>
    </div>

    <div class="container">
        <canvas id="game" width="480" height="640"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">Breakout</h2>
            <p id="overlayText">Use o mouse ou as setas para mover o paddle</p>
            <button id="overlayBtn" onclick="startGame()">Jogar</button>
            <button class="secondary" onclick="window.location.href='index.html'">Menu</button>
        </div>
    </div>

    <div class="instructions">
        <strong>Mouse</strong>: mover paddle · <strong>Setas</strong>: esquerda/direita · <strong>Espaço</strong>: lançar bola
    </div>

    <script src="breakout.js"></script>
</body>
</html>
