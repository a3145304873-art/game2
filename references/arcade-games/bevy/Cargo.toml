[package]
name = "arcade-bevy"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_text", "bevy_ui",
    "bevy_winit", "bevy_asset", "webgl2", "bevy_gilrs", "png", "x11", "bevy_state"
] }
rand = "0.8"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
wasm-bindgen = "0.2"
