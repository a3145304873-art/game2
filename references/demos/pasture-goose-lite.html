<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>鹅鹅牧场 · 攒金币</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#bfe3a6; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  /* ── HUD：黑金风信息条（对标大鹅吃草燕云风 HUD），安全区适配 ── */
  #hud {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    background:rgba(16,14,10,.78); color:#e6cf9a; padding:8px 24px; border-radius:2px;
    font-size:16px; font-weight:600; letter-spacing:2px; z-index:10; pointer-events:none;
    border:1px solid rgba(190,155,90,.7);
    box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 0 12px rgba(0,0,0,.4);
    white-space:nowrap;
  }
  #hud .sep { width:1px; height:16px; background:rgba(190,155,90,.45); }
  #hud b { color:#ffd76a; font-variant-numeric:tabular-nums; }

  /* 连击/事件横幅：中上部瞬时提示 */
  #banner {
    position:fixed; top:22%; left:50%; transform:translateX(-50%) scale(.8);
    color:#ffe08a; font-size:26px; font-weight:800; letter-spacing:2px; z-index:11;
    text-shadow:0 2px 10px rgba(40,25,0,.65), 0 0 18px rgba(255,190,60,.5);
    opacity:0; transition:opacity .18s, transform .18s; pointer-events:none; white-space:nowrap;
  }
  #banner.show { opacity:1; transform:translateX(-50%) scale(1); }

  /* 遮罩弹窗通用：黑金风（参考大鹅吃草结算卡） */
  .overlay {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,10,.62); opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .card {
    width:min(84vw,340px);
    background:linear-gradient(170deg, rgba(32,27,18,.97), rgba(18,15,11,.97));
    border:1px solid #b3924f; border-radius:4px;
    box-shadow:0 12px 44px rgba(0,0,0,.65), inset 0 0 0 1px rgba(230,200,140,.14), inset 0 0 32px rgba(0,0,0,.5);
    text-align:center; padding:26px 20px 22px; position:relative;
    transform:scale(.86); transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay.show .card { transform:scale(1); }
  .card h2 {
    color:#f0ddb0; font-size:23px; letter-spacing:5px; margin-bottom:8px; font-weight:600;
    font-family:"STSong","SimSun","Songti SC",serif;
  }
  .card p  { color:#a8946a; font-size:14px; line-height:1.7; margin-bottom:16px; letter-spacing:1px; }
  .card p b { color:#e0bd7a; }
  .btn {
    display:block; width:100%; border:none; border-radius:2px; cursor:pointer;
    padding:13px 0; font-size:17px; font-weight:700; letter-spacing:4px; margin-top:10px;
  }
  .btn-main {
    background:linear-gradient(180deg,#e8c878,#c9992e); color:#2a1f08;
    box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,240,200,.5);
  }
  .btn-main.breathing { animation:breath 1.6s ease-in-out infinite; }
  @keyframes breath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  .btn-sub {
    background:transparent; color:#cbb98d; border:1px solid rgba(190,155,90,.55);
    box-shadow:none; letter-spacing:1px;
  }
  .btn[disabled] { filter:grayscale(.9); opacity:.6; pointer-events:none; }

  /* 奖品档位徽标与内容 */
  .tier-chip { display:inline-block; font-size:12px; letter-spacing:2px; padding:3px 12px; border-radius:2px; margin-bottom:10px; border:1px solid currentColor; }
  .prize-big { font-size:44px; line-height:1.15; margin:4px 0 8px; }
  .prize-big img { height:96px; filter:drop-shadow(0 6px 12px rgba(0,0,0,.6)); }
  .code-box {
    margin:12px auto 4px; max-width:230px;
    background:linear-gradient(180deg,#3a2d14,#241b0c); color:#ffe08a;
    border:1px solid #8a6d3a; border-radius:2px;
    padding:12px 10px; font-size:18px; letter-spacing:2px; font-weight:700;
  }
  .code-copy { font-size:12px; color:#c89b52; margin-top:8px; cursor:pointer; text-decoration:underline; letter-spacing:1px; }

  /* 福利二选一：两张奖券卡（参考大鹅吃草"福利二选一"礼包卡） */
  #flavor-row { display:flex; gap:10px; justify-content:center; margin:6px 0 14px; }
  .flavor {
    flex:1 1 0; background:#241d10; border:1px solid #6e5730; border-radius:3px;
    padding:12px 6px 10px; cursor:pointer; transition:all .15s;
  }
  .flavor img { height:64px; display:block; margin:0 auto 6px; }
  .flavor .f-emoji { font-size:38px; line-height:64px; display:block; margin-bottom:6px; }
  .flavor .f-name { color:#e6cf9a; font-size:13px; letter-spacing:1px; }
  .flavor.sel {
    border-color:#ffd76a; background:#3a2d14;
    box-shadow:0 0 14px rgba(255,215,106,.35), inset 0 0 8px rgba(255,215,106,.15);
  }
  .flavor.sel::after { content:'✓ 已选'; display:block; color:#ffd76a; font-size:11px; margin-top:6px; letter-spacing:2px; }

  /* 欧皇降临 / 抽奖演出层 */
  #lottery { background:rgba(15,10,0,.86); z-index:30; flex-direction:column; gap:6px; }
  #lottery .rays {
    position:absolute; width:130vmax; height:130vmax; left:50%; top:50%;
    background:conic-gradient(from 0deg, transparent 0 10deg, rgba(255,214,94,.16) 10deg 20deg) ;
    border-radius:50%; animation:spin 7s linear infinite; pointer-events:none;
  }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg);} }
  #lottery h1 {
    position:relative; color:#ffe08a; font-size:40px; letter-spacing:8px;
    animation:pop 0.5s cubic-bezier(.2,1.6,.4,1) both;
    text-shadow:0 0 24px rgba(255,204,80,.85), 0 0 60px rgba(255,170,40,.5);
  }
  @keyframes pop { from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }
  #lottery p { position:relative; color:#e8cf92; letter-spacing:2px; font-size:15px; }

  /* 新手手势 */
  #gesture { position:fixed; z-index:12; left:50%; top:58%; transform:translateX(-50%);
    color:#fff; font-size:14px; letter-spacing:1px; opacity:.95; text-align:center;
    background:rgba(30,42,20,.55); padding:10px 16px; border-radius:14px;
    transition:opacity .6s; pointer-events:none; white-space:nowrap; }
  #gesture.hide { opacity:0; }

  .small-note{font-size:12px;color:#b0905a;margin-top:12px;letter-spacing:1px;}

  /* 虚拟摇杆（3D 版使用）：按下处出现外环，拖动内钮指示方向 */
  #stick { position:fixed; width:104px; height:104px; border-radius:50%;
    border:2px solid rgba(255,215,106,.65); background:rgba(16,14,10,.25);
    z-index:13; pointer-events:none; display:none; transform:translate(-50%,-50%); }
  #stick-knob { position:absolute; left:50%; top:50%; width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ffe08a, #c9992e);
    box-shadow:0 2px 8px rgba(0,0,0,.5); transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <span>🌾 <b id="score">0</b></span><i class="sep"></i>
  <span>⏱ <b id="time">60</b>s</span><i class="sep"></i>
  <span id="lv">Lv.1</span>
</div>
<div id="banner"></div>
<div id="gesture">👉 按住屏幕拖动，小鹅朝手指方向走</div>
<div id="stick"><div id="stick-knob"></div></div>

<!-- 开始页 -->
<div class="overlay show" id="ov-menu">
  <div class="card">
    <h2>鹅鹅牧场 · 攒金币</h2>
    <p>60 秒内带小鹅多吃草多攒金币<br>≥<b id="th-mid">40</b> 金币得进阶好礼 · ≥<b id="th-top">80</b> 金币抽大奖<br>人人都有保底奖励哦～</p>
    <button class="btn btn-main breathing" id="btn-start">开始游戏</button>
    <button class="btn btn-sub" id="btn-invite-menu">邀请好友得 1 次机会</button>
    <div class="small-note" id="plays-note">今日剩余次数：<span id="plays-left">3</span></div>
  </div>
</div>

<!-- 结算 & 礼包（先出成绩，点继续再出礼包） -->
<div class="overlay" id="ov-result">
  <div class="card">
    <div id="result-score-block">
      <h2>时间到！</h2>
      <p>本次攒下金币 <b style="color:#d3862a;font-size:26px;" id="final-score">0</b><br>历史最高 <b id="best-score">0</b></p>
      <button class="btn btn-main" id="btn-to-gift">查看奖励 🎁</button>
      <button class="btn btn-sub" id="btn-again">再来一次</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-gift">
  <div class="card">
    <span class="tier-chip" id="gift-tier">保底福利</span>
    <div class="prize-big" id="gift-pic" style="display:none">🎫</div>
    <h2 id="gift-name">恭喜获得奖励</h2>
    <p id="gift-desc">两项福利二选一，点击选中后领取</p>
    <div id="flavor-row"></div>
    <button class="btn btn-main breathing" id="btn-claim">立即领取</button>
    <button class="btn btn-sub" id="btn-share">邀请好友再玩一次</button>
  </div>
</div>

<div class="overlay" id="ov-code">
  <div class="card">
    <h2>领取成功 🎉</h2>
    <p>凭以下卡券码到活动页核销</p>
    <div class="code-box"><span id="code-text">DEMO-0000</span></div>
    <div class="code-copy" id="code-copy">复制卡券码</div>
    <button class="btn btn-main" id="btn-finish">完成</button>
  </div>
</div>

<!-- 抽奖演出（仅大奖触发时出现） -->
<div class="overlay" id="lottery">
  <div class="rays"></div>
  <h1>欧皇降临</h1>
  <p>命运式神正在为你揭晓大奖…</p>
</div>

<script>
"use strict";
/* =====================================================================
 * 鹅鹅牧场 Lite —— 轻量发奖小游戏样例
 * 形态：单文件 HTML / 零依赖 / 资源可替换
 * 说明：API 与资源均为占位实现，结构与参数已按后端对接规范预留。

/* ---------- 0. 可调配置（策划数值集中区） ---------- */
const CFG = {
  DURATION : 60,          // 一局时长(秒)。发奖游戏原则：基础档达成率≥85%，靠时长和判定调心理难度
  W : 750, H : 1334,      // 逻辑分辨率 9:16，画布等比缩放适配
  SPEED   : 400,          // 小鹅速度 px/s（逻辑坐标）
  EAT_R   : 62,           // 进食判定半径
  SPAWN_MAX : 24,         // 场上草垛上限
  GOLD_P  : 0.07,         // 金麦穗概率
  LEVELS  : [10, 25, 50], // 等级阈值(升级纯氛围，不改变核心难度)
  COMBO_GAP : 1.2,        // 连击窗口秒
};

/* 奖项配置：condition 从高到低命中即停；base 必须兜底 ()=>true */
const REWARDS = [
  { id:'top',  name:'三十连金牌幸运箱', pic:'🏆', desc:'恭喜抽中最高档大奖！', tier:'至尊大奖', tierColor:'#e0482e', lottery:true,
    condition:(s)=> s.score >= 80 },
  { id:'mid',  name:'黄金牧草礼包',     pic:'🎁', desc:'表现优异，进阶好礼已备好～', tier:'进阶奖励', tierColor:'#d3862a',
    condition:(s)=> s.score >= 40 },
  { id:'base', name:'牧场体验券',       pic:'🎫', desc:'感谢参与，基础福利人人有份～', tier:'保底福利', tierColor:'#7a9c46',
    condition:( )=> true },
];

/* ---------- 1. 服务端接口占位（对接时只改这里） ---------- */
const API = {
  getConfig(){ return Promise.resolve({ remainingPlays: 3 }); },            // 频控查询
  submitScore(payload){ console.info('[埋点上报] submitScore', payload); return Promise.resolve({ ok:true }); },
  claimReward(rewardId){                                                    // 领奖（演示模拟 900ms）
    console.info('[领奖请求] claimReward', rewardId);
    return new Promise(r=>setTimeout(()=>r({ success:true, code:'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase(), stockOut:false }),900));
  },
};
/* 埋点（正式接入换成真打点 SDK） */
const TRACK = {
  onGameStart(){ console.info('[埋点] game_start'); },
  onGameOver(s){ console.info('[埋点] game_over', s); },
  rewardShow(id){ console.info('[埋点] reward_show', id); },
  rewardClaimSuccess(id){ console.info('[埋点] reward_claim_success', id); },
  rewardStockOut(){ console.info('[埋点] reward_stockout'); },
};
/* 分享占位：微信环境接 wx.updateAppMessageShareData；失败时 toast 提示 */
function shareToFriend(){ toast('已唤起分享（演示占位，请接 JS-SDK）'); console.info('[分享] shareToFriend'); }

/* ---------- 2. 画布与坐标系 ---------- */
const ASSETS = window.ASSETS || {};        // 外部素材表（base64），由打包脚本注入
const ASSETS_IMG = {};                     // 解码后的 Image 对象，供 canvas 使用
for (const k in ASSETS){ const im = new Image(); im.src = ASSETS[k]; ASSETS_IMG[k] = im; }
const appEl = document.getElementById('app');
const cv = document.createElement('canvas'); appEl.appendChild(cv);
const ctx = cv.getContext('2d');
let viewScale=1, offX=0, offY=0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  viewScale = Math.min(cv.width/CFG.W, cv.height/CFG.H);
  offX=(cv.width-CFG.W*viewScale)/2; offY=(cv.height-CFG.H*viewScale)/2;
}
addEventListener('resize', resize); resize();

function toLogic(e){
  const r=cv.getBoundingClientRect();
  return { x:((e.clientX-r.left)*dprEff()-offX)/viewScale, y:((e.clientY-r.top)*dprEff()-offY)/viewScale };
}
function dprEff(){ return cv.width/innerWidth; }

/* ---------- 3. 游戏状态 ---------- */
let mode='menu';                  // menu | play | pause | end
const G = { score:0, timeLeft:CFG.DURATION, combo:0, lastEat:0, level:1,
            goose:{x:375,y:900,hx:0,hy:-1}, trail:[], foods:[], parts:[],
            dragging:false, target:null };

const $ = id=>document.getElementById(id);
const hudScore=$('score'), hudTime=$('time'), hudLv=$('lv');

/* ---------- 4. 资源占位与程序化绘制 ----------
 * 正式美术走 window.ASSETS 键值对(base64)，绘制函数优先取图：
 *   ASSETS.food_grass / food_gold / goose_body / bg_tile ...
 * 没图则用下面的程序化绘制兜底，保证换皮前后均可运行 */
const PAINTERS = {
  foodGrass(x,y,s,t){
    ctx.save(); ctx.translate(x,y+Math.sin(t*3+x)*2);
    ctx.strokeStyle='#3f7d2c'; ctx.lineWidth=5*s; ctx.lineCap='round';
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*9*s,8*s);
      ctx.quadraticCurveTo(i*14*s,-6*s,i*18*s,-20*s); ctx.stroke(); }
    ctx.restore();
  },
  foodGold(x,y,s,t){
    ctx.save(); ctx.translate(x,y); const k=Math.sin(t*5)*0.12+1; ctx.scale(k,k);
    ctx.shadowColor='rgba(255,205,70,.9)'; ctx.shadowBlur=18*s;
    ctx.fillStyle='#ffc63c';
    for(let i=0;i<5;i++){ ctx.rotate(Math.PI*2/5*(t*.6));
      ctx.beginPath(); ctx.ellipse(0,-14*s,6*s,15*s,0,0,7); ctx.fill(); }
    ctx.restore();
  },
};

/* ---------- 4.5 背景烘焙：GLSL 着色器一次性烘焙整片草地 ----------
 * 思路对标原作的程序化草地：噪声色斑 + 修剪条纹 + 细草叶 + 草丛簇 + 零星小花。
 * 启动时烘焙一次，运行时仅一次 drawImage，零逐帧开销。
 * 优先级：ASSETS.bg_tile 外部素材 > 着色器烘焙 FIELD > 2D 棋盘兜底 */
const FIELD=(function(){
  try{
    const S=Math.min(window.devicePixelRatio||1,2);
    const w=Math.round(CFG.W*S), h=Math.round(CFG.H*S);
    const glc=document.createElement('canvas'); glc.width=w; glc.height=h;
    const gl=glc.getContext('webgl',{preserveDrawingBuffer:true});
    if(!gl) return null;
    const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const FS=[
      'precision mediump float;',
      'uniform vec2 uRes; uniform float uSeed;',
      'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
      '  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}',
      'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=.5;}return v;}',
      'void main(){',
      '  vec2 uv=gl_FragCoord.xy/uRes; vec2 px=gl_FragCoord.xy;',
       // 基底：自然草坪深绿双色（降低卡通感的粉彩饱和度）
      '  vec3 cA=vec3(0.408,0.584,0.302), cB=vec3(0.310,0.478,0.208);',
      '  vec3 col=mix(cB,cA,smoothstep(.30,.70,fbm(uv*5.+uSeed)));',
       // 斜向修剪条纹（更强、带弯曲扰动）
      '  col*=1.+sin((px.x+px.y)*.014+fbm(uv*2.5+uSeed)*3.)*.05;',
       // 草叶两层：随风倒向一致的高频拉长条纹（弯而不乱）
      '  float warp=fbm(uv*3.5+uSeed)*9.;',
      '  col*=.90+noise(vec2(px.x*2.1+warp*46.,px.y*.13))*.20;',
      '  col*=.95+noise(vec2(px.x*.8 +warp*22.,px.y*.05))*.10;',
       // 草丛簇：簇间压暗(遮挡) 簇顶提亮(受光)
      '  float clump=fbm(uv*16.+uSeed*2.);',
      '  col*=1.-smoothstep(.52,.72,clump)*.16;',
      '  col=mix(col,col*vec3(1.05,1.09,.92),smoothstep(.68,.85,clump)*.55);',
       // 裸土磨损斑（真实草坪的踩踏土痕）
      '  float wear=fbm(uv*3.2+uSeed+13.7);',
      '  col=mix(col,vec3(0.47,0.42,0.28),smoothstep(.74,.92,wear)*.30);',
       // 零星小雏菊（更稀有更小）
      '  vec2 cell=floor(px/30.); float hh=hash(cell+uSeed);',
      '  if(hh>.982){',
      '    vec2 c=(cell+.5)*30.+vec2(hash(cell+1.7),hash(cell+2.3)-.5)*16.;',
      '    float d=length(px-c);',
      '    col=mix(col,vec3(.96),smoothstep(2.2,1.6,d));',
      '    col=mix(col,vec3(1.,.82,.25),smoothstep(.9,.5,d));',
      '  }',
       // 天光：顶部受光 + 四周暗角
      '  col*=1.+(uv.y-.5)*.10;',
      '  float vg=distance(uv,vec2(.5,.45));',
      '  col*=1.-smoothstep(.52,.95,vg)*.22;',
      '  gl_FragColor=vec4(col,1.);',
      '}',
    ].join('\n');
    function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
    const pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
    gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW); // 全屏大三角
    const loc=gl.getAttribLocation(pr,'p');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.uniform2f(gl.getUniformLocation(pr,'uRes'),w,h);
    gl.uniform1f(gl.getUniformLocation(pr,'uSeed'),7.31);
    gl.viewport(0,0,w,h);
    gl.drawArrays(gl.TRIANGLES,0,3);
    return glc;
  }catch(e){ console.warn('着色器草地烘焙失败，回落棋盘背景：',e); return null; }
})();

/* ---------- 5. 输入 ---------- */
addEventListener('pointerdown', e=>{ if(mode!=='play')return; G.dragging=true; G.target=toLogic(e); hideGesture(); });
addEventListener('pointermove', e=>{ if(!G.dragging||mode!=='play')return; G.target=toLogic(e); });
addEventListener('pointerup'  , ()=>{ G.dragging=false; });

/* 刷草：普通草 / 金麦穗(7%) / 宝箱彩蛋(1.5%，用《大鹅吃草》复用素材) */
function spawnFood(forcePlain){
  for(let tries=0;tries<12;tries++){
    const x=90+Math.random()*(CFG.W-180), y=200+Math.random()*(CFG.H-380);
    if(Math.hypot(x-G.goose.x,y-G.goose.y)<130) continue;
    const r=Math.random();
    const kind = forcePlain ? 'grass' : r<0.015 ? 'chest' : r<0.015+CFG.GOLD_P ? 'gold' : 'grass';
    G.foods.push({x,y,kind,gold:kind==='gold'}); return;
  }
}

/* ---------- 6. 主循环 ---------- */
let lastT=performance.now(), spawnAcc=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(mode==='play') step(dt, now/1000);
  render(now/1000);
}
requestAnimationFrame(loop);

function step(dt,t){
  // 计时
  G.timeLeft-=dt;
  hudTime.textContent=Math.max(0,Math.ceil(G.timeLeft));
  if(G.timeLeft<=0){ finishGame(); return; }

  // 移动：按住屏幕 → 目标点方向恒速移动（与对标手感一致）
  if(G.dragging && G.target){
    const g=G.goose, dx=G.target.x-g.x, dy=G.target.y-g.y, d=Math.hypot(dx,dy);
    if(d>6){
      g.x+=dx/d*CFG.SPEED*dt; g.y+=dy/d*CFG.SPEED*dt;
      const ta=Math.atan2(dy,dx), ca=Math.atan2(g.hy,g.hx); let da=ta-ca;
      while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
      const na=ca+da*Math.min(1,dt*10);
      g.hx=Math.cos(na); g.hy=Math.sin(na);
    }
    g.x=Math.min(CFG.W-60,Math.max(60,g.x)); g.y=Math.min(CFG.H-160,Math.max(140,g.y));
  }

  // 尾迹：记录路径点位形成“变长”的视觉成长
  const tr=G.trail, head={x:G.goose.x,y:G.goose.y};
  if(!tr.length||Math.hypot(head.x-tr[0].x,head.y-tr[0].y)>14) tr.unshift({...head});
  const maxSeg=Math.min(56, 8+Math.floor(G.score*0.5));
  while(tr.length>maxSeg) tr.pop();

  // 进食与连击
  for(let i=G.foods.length-1;i>=0;i--){
    const f=G.foods[i];
    if(Math.hypot(f.x-G.goose.x,f.y-G.goose.y)<CFG.EAT_R){
      G.foods.splice(i,1);
      const gap=t-G.lastEat;
      G.combo = (gap<CFG.COMBO_GAP)? G.combo+1 : 1;
      G.lastEat=f.kind==='grass'? t : -9;                 // 特殊食物不参与连击计费
      let gain = f.kind==='chest'? 10 : f.gold? 5 : 1;
      if(f.kind==='chest'){ setBanner('宝箱 +10','#e8c878'); burst(f.x,f.y,'#ffd76a'); jingle(); }
      else if(f.gold){ setBanner('金麦穗 +5','#ffc63c'); burst(f.x,f.y,'#ffdf7e'); }
      if(G.combo>0 && G.combo%5===0){ gain+=2; setBanner(`连击 ×${G.combo}  +${gain}`,'#ffb14e'); }
      addScore(gain);
      burst(f.x,f.y,'#7fb95a');
      beep(f.kind==='chest'?1046:f.gold?880:520+(G.combo%5)*40, .08);
    }
  }

  // 刷草
  spawnAcc+=dt;
  if(spawnAcc>.35 && G.foods.length<CFG.SPAWN_MAX){ spawnAcc=0; spawnFood(Math.random()<CFG.GOLD_P); }

  // 粒子
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; if(p.life<=0)G.parts.splice(i,1); }
}

function addScore(v){
  G.score+=v; hudScore.textContent=G.score;
  for(let li=0;li<CFG.LEVELS.length;li++)
    if(G.score>=CFG.LEVELS[li] && G.level===li+1){ G.level++; hudLv.textContent='Lv.'+G.level;
      setBanner('Lv.'+G.level+' 牧场伙食变好了！','#9fe070'); jingle(); }
}

function burst(x,y,color){ for(let i=0;i<10;i++) G.parts.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*220-40,life:.5+Math.random()*.3,color,r:3+Math.random()*4}); }

/* ---------- 7. 渲染 ---------- */
function render(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(offX,offY); ctx.scale(viewScale,viewScale);

  // 背景三级优先：外部 bg_tile 素材 > 着色器烘焙草地 FIELD > 程序化棋盘
  const bt=ASSETS_IMG.bg_tile;
  if(bt && bt.complete && bt.naturalWidth){
    for(let gy=0;gy<CFG.H;gy+=112)for(let gx=0;gx<CFG.W;gx+=112) ctx.drawImage(bt,gx,gy,112,112);
  } else if(FIELD){
    ctx.drawImage(FIELD,0,0,CFG.W,CFG.H);
  } else {
    ctx.fillStyle='#a8d487'; ctx.fillRect(0,0,CFG.W,CFG.H);
    ctx.fillStyle='#b1dd90';
    for(let gy=0;gy<CFG.H;gy+=112)for(let gx=((gy/112)%2)*112;gx<CFG.W;gx+=224) ctx.fillRect(gx,gy,112,112);
  }

  // 食物：宝箱优先用复用素材图，其余程序化绘制
  for(const f of G.foods) drawFood(f,t);

  // 尾迹身体
  const tr=G.trail;
  for(let i=tr.length-1;i>=0;i--){ const p=tr[i],k=i/tr.length;
    ctx.fillStyle=`rgba(245,250,235,${.9-k*.55})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,26-16*k,0,7); ctx.fill(); }

  // 小鹅落地阴影（无论哪种皮肤都先画影子，增强体积真实感）
  ctx.fillStyle='rgba(20,40,10,.20)';
  ctx.beginPath(); ctx.ellipse(G.goose.x,G.goose.y+30,32,10,0,0,7); ctx.fill();
  // 小鹅本体（正式版可整体替换为 ASSETS.goose 序列帧）
  drawGoose(G.goose, t);

  // 粒子
  for(const p of G.parts){ ctx.globalAlpha=Math.max(p.life*2,0); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  ctx.restore();
}

/* 绘制分发：有素材图用 drawImage（素材接入示范），否则回落程序化绘制 */
function drawFood(f,t){
  const img=(k)=>ASSETS_IMG[k]&&ASSETS_IMG[k].complete&&ASSETS_IMG[k].naturalWidth?ASSETS_IMG[k]:null;
  if(f.kind==='chest'){ const im=img('gift_top'); if(im){ ctx.drawImage(im,f.x-36,f.y-36,72,72); return; } }
  if(f.kind==='gold'){ const im=img('food_gold'); if(im){ ctx.drawImage(im,f.x-30,f.y-30,60,60); return; } }
  if(f.kind==='grass'){ const im=img('food_grass'); if(im){ ctx.drawImage(im,f.x-26,f.y-26,52,52); return; } }
  (f.gold?PAINTERS.foodGold:PAINTERS.foodGrass)(f.x,f.y,1.2,t);
}

/* 鹅绘制：优先 ASSETS 素材（支持单帧图 goose.png 或 8 帧横条带 goose_strip.png，
 * 作画约定为"头朝上"，与程序化绘制一致），否则回落程序化绘制 */
function drawGoose(g,t){
  const strip=ASSETS_IMG.goose_strip, single=ASSETS_IMG.goose;
  const im=(strip&&strip.complete&&strip.naturalWidth)?strip:(single&&single.complete&&single.naturalWidth)?single:null;
  if(im){
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(Math.atan2(g.hy,g.hx)+Math.PI/2);
    if(im===strip && strip.naturalWidth>strip.naturalHeight*4){      // 8 帧条带按 10fps 循环
      const fw=strip.naturalWidth/8;
      ctx.drawImage(strip, Math.floor(t*10)%8*fw, 0, fw, strip.naturalHeight, -55,-55,110,110);
    } else ctx.drawImage(im,-55,-55,110,110);
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(Math.atan2(g.hy,g.hx)+Math.PI/2);
  const wob=Math.sin(t*8)*(G.dragging?3:1);
  // 脚蹼
  ctx.strokeStyle='#e8862c'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-12,wob*0);ctx.lineTo(-20,22+wob); ctx.moveTo(12,0);ctx.lineTo(20,22-wob); ctx.stroke();
  // 身体
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(0,0,30,36,0,0,7); ctx.fill();
  ctx.strokeStyle='#dcd3bd'; ctx.lineWidth=2.5; ctx.stroke();
  // 腹部沉色 + 背部受光（体积感）
  ctx.fillStyle='rgba(205,196,172,.5)';
  ctx.beginPath(); ctx.ellipse(0,14,24,14,0,0,Math.PI); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.ellipse(-4,-12,18,11,-.35,0,7); ctx.fill();
  // 头颈
  ctx.beginPath(); ctx.ellipse(0,-34,16,20,0,0,7); ctx.fill(); ctx.stroke();
  // 喙
  ctx.fillStyle='#f2a93b'; ctx.beginPath(); ctx.moveTo(0,-52); ctx.lineTo(-11,-64); ctx.lineTo(11,-64); ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle='#33302a'; ctx.beginPath(); ctx.arc(-6,-38,3,0,7); ctx.arc(6,-38,3,0,7); ctx.fill();
  // 翅膀
  ctx.strokeStyle='#e7e0cc'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,-2,20,-.6,.6); ctx.stroke();
  ctx.restore();
}

/* ---------- 8. 流程控制 ---------- */
function startGame(){
  Object.assign(G,{score:0,timeLeft:CFG.DURATION,combo:0,lastEat:0,level:1,trail:[],foods:[],parts:[],
                   goose:{x:375,y:900,hx:0,hy:-1}});
  hudScore.textContent='0'; hudLv.textContent='Lv.1';
  for(let i=0;i<14;i++) spawnFood(false);
  mode='play'; TRACK.onGameStart();
  show('ov-menu',false); show('ov-result',false); show('ov-gift',false); show('ov-code',false);
}

async function finishGame(){
  mode='end'; G.dragging=false;
  TRACK.onGameOver(G.score);
  $('final-score').textContent=G.score;
  const best=Math.max(G.score, +(localStorage.getItem('goose_lite_best')||0));
  localStorage.setItem('goose_lite_best', best); $('best-score').textContent=best;
  await API.submitScore({ score:G.score, duration:CFG.DURATION, ts:Date.now() });  // 判定权在服务端，前端演出
  show('ov-result',true);
}

/* 点击「查看奖励」→ 命中档位 → 大奖播放抽奖演出 → 礼包弹窗 */
$('btn-to-gift').onclick=async()=>{
  const tier=[...REWARDS].find(r=>r.condition(G));        // REWARDS 已按高→低排序，命中第一个
  TRACK.rewardShow(tier.id);
  if(tier.lottery){ show('lottery',true); await wait(1700); show('lottery',false); }  // 抽奖动画期间等待真实结果
  const claimed=tier.claimed? {...tier,code:'---'} : null;
  $('gift-tier').textContent=tier.tier; $('gift-tier').style.background=tier.tierColor+'22';
  $('gift-tier').style.color=tier.tierColor;
  currentTier=tier;
  const row=$('flavor-row');
  if(tier.lottery){                     // 大奖：直领仪式感，不参与二选一
    row.style.display='none'; $('gift-pic').style.display='block';
    applyGiftPic(tier);
    $('gift-name').textContent=tier.name; $('gift-desc').textContent=tier.desc;
    $('btn-claim').textContent='立即领取';
  } else {                              // 普通档：福利二选一（参考大鹅吃草礼包卡）
    row.style.display='flex'; $('gift-pic').style.display='none';
    row.innerHTML=FLAVORS.map((f,i)=>{
      const src=ASSETS[f.picKey];
      const visual=src?`<img src="${src}">`:`<span class="f-emoji">${f.emoji}</span>`;
      return `<div class="flavor${i===0?' sel':''}" data-i="${i}">${visual}<div class="f-name">${f.name}</div></div>`;
    }).join('');
    pickedFlavor=0;
    $('gift-name').textContent='恭喜获得 '+tier.name;
    $('gift-desc').textContent=tier.desc+' 两项福利二选一～';
    [...row.children].forEach(el=>el.onclick=()=>{
      pickedFlavor=+el.dataset.i;
      [...row.children].forEach(c=>c.classList.toggle('sel',c===el));
      refreshClaimText(tier);
    });
    refreshClaimText(tier);
  }
  show('ov-result',false); show('ov-gift',true);
};
/* 二选一奖面：同档位两种奖励皮肤，选择仅影响发放文案与展示；档位判定仍以 tier 为准 */
const FLAVORS=[
  { id:'fubag',  name:'惊喜福袋', picKey:'gift_mid',  emoji:'🧧' },
  { id:'jinang', name:'侠客锦囊', picKey:'gift_base', emoji:'📜' },
];
let pickedFlavor=0;
function refreshClaimText(tier){
  $('btn-claim').textContent = tier.lottery ? '立即领取' : '领取「'+FLAVORS[pickedFlavor].name+'」';
}
/* 奖品图：优先复用素材(gift_base 卷轴 / gift_mid 福袋 / gift_top 宝箱)，无则回落 emoji */
function applyGiftPic(tier){
  const el=$('gift-pic'), src=ASSETS['gift_'+tier.id];
  el.innerHTML = src ? `<img src="${src}">` : tier.pic;
}
let currentTier=null;

/* 领奖按钮 → 调服务端 → 展示卡券码；成功后按钮置灰禁点防重复领取 */
$('btn-claim').onclick=async ev=>{
  const btn=ev.currentTarget; TRACK.onGiftClick?.() || console.info('[埋点] gift_click',currentTier.id);
  btn.disabled=true; btn.textContent='领取中…';
  const res=await API.claimReward(currentTier.id);
  btn.textContent='立即领取';
  if(res.stockOut){ TRACK.rewardStockOut(); toast('本场福利已被抢完啦～'); btn.disabled=false; return; }
  if(res.success){
    TRACK.rewardClaimSuccess(currentTier.id);
    $('code-text').textContent=res.code;
    show('ov-gift',false); show('ov-code',true);
    btn.classList.remove('breathing'); btn.textContent='已领取';          // 保持 disabled，静态化防重复
  } else { btn.disabled=false; toast('领取失败，请稍后再试'); }
};

$('btn-start').onclick=startGame;
$('btn-again').onclick=startGame;
$('btn-share').onclick=shareToFriend;
$('btn-invite-menu').onclick=shareToFriend;
$('btn-finish').onclick=()=>show('ov-code',false);

$('code-copy').onclick=()=>{
  const txt=$('code-text').textContent;
  (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('已复制')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制'); });
};

/* 频控占位：进入页面读取剩余次数，为 0 时主按钮文案切换 */
API.getConfig().then(c=>{
  $('plays-left').textContent=c.remainingPlays;
  if(c.remainingPlays<=0){ $('btn-start').textContent='今日次数已用完';
    $('btn-start').disabled=true; $('btn-invite-menu').focus?.(); }
});

/* ---------- 9. 工具函数 ---------- */
function show(id,on){ $(id).classList.toggle('show',on); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
let bannerTimer=null;
function setBanner(text,color){ const b=$('banner'); b.textContent=text; b.style.color=color||'#fff';
  b.classList.add('show'); clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>b.classList.remove('show'),1100); }
function hideGesture(){ const g=$('gesture'); if(!g.dataset.used){ g.dataset.used=1; setTimeout(()=>g.classList.add('hide'),600);} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='play'){ mode='pause'; toast('已暂停，点击继续'); } else if(mode==='pause'&&mode!=='end'){ mode='play'; lastT=performance.now(); } });
addEventListener('pointerdown',()=>{ if(mode==='pause'){ mode='play'; lastT=performance.now(); } },{capture:true});

/* 音效：WebAudio 合成零资源（可换 base64 音频） */
let AC=null, muted=false;
function ac(){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(f,d,type='triangle',g=.12){ if(muted)return; try{ const a=ac(),o=a.createOscillator(),gn=a.createGain();
  o.type=type; o.frequency.value=f; gn.gain.value=g; o.connect(gn).connect(a.destination);
  o.start(); gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d); o.stop(a.currentTime+d);}catch(e){} }
function jingle(){ [660,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.09),i*90)); }

/* 初始化：手势图复用《大鹅吃草》素材（gesture_hand），无则纯文字 */
if(ASSETS.gesture_hand){
  $('gesture').innerHTML = `<img src="${ASSETS.gesture_hand}" style="height:58px;display:block;margin:0 auto 4px">👉 按住屏幕滑动，小鹅跟手吃草攒金币`;
}
